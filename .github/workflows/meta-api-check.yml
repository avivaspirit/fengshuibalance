name: Extract all page tokens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Get all page tokens via /me/accounts
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          curl -s "https://graph.facebook.com/v21.0/me/accounts?fields=id,name,username,access_token&limit=100&access_token=${FB_PAGE_ACCESS_TOKEN}" | \
          python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          out = {}
          for p in data.get('data', []):
              name = (p.get('name','') + ' ' + p.get('username','')).lower()
              pid = p['id']
              tok = p.get('access_token','')
              if pid == '445083192208430' or 'aviva' in name:
                  out['AVIVA_PAGE_ID'] = pid
                  out['AVIVA_PAGE_TOKEN'] = tok
              elif pid == '367355370015900' or 'fengshui' in name:
                  out['FENGSHUI_PAGE_ID'] = pid
                  out['FENGSHUI_PAGE_TOKEN'] = tok
              elif pid == '914737241717875' or 'flow' in name:
                  out['FLOW_PAGE_ID'] = pid
                  out['FLOW_PAGE_TOKEN'] = tok
              elif pid == '107760637798012' or 'miracles' in name:
                  out['MIRACLES_PAGE_ID'] = pid
                  out['MIRACLES_PAGE_TOKEN'] = tok
          with open('tokens.env', 'w') as f:
              for k, v in out.items():
                  f.write(f'{k}={v}\n')
          for k, v in out.items():
              val = str(v)
              if 'TOKEN' in k and len(val) > 20:
                  print(f'{k}={val[:10]}...{val[-6:]}')
              else:
                  print(f'{k}={val}')
          print(f'Total pages: {len(out)//2}')
          "

      - name: Upload tokens as artifact
        uses: actions/upload-artifact@v4
        with:
          name: page-tokens
          path: tokens.env
          retention-days: 1
