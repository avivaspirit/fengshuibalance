name: Meta API — check permissions & test post

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options:
          - debug_only
          - get_all_page_tokens
          - test_post
      target_page:
        description: 'FB Page ID (default: Fengshui Balance)'
        required: false
        type: string
        default: '367355370015900'

permissions:
  contents: read

jobs:
  meta-api:
    runs-on: ubuntu-latest
    outputs:
      aviva_token: ${{ steps.get-tokens.outputs.aviva_token }}
      flow_token: ${{ steps.get-tokens.outputs.flow_token }}
      miracles_token: ${{ steps.get-tokens.outputs.miracles_token }}
      fengshui_token: ${{ steps.get-tokens.outputs.fengshui_token }}
    steps:
      - name: Debug token
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ github.event.inputs.target_page || '367355370015900' }}
        run: |
          echo "=== TOKEN DEBUG ==="
          curl -s "https://graph.facebook.com/v21.0/debug_token?input_token=${FB_PAGE_ACCESS_TOKEN}&access_token=${FB_APP_ID}|${FB_APP_SECRET}" | python3 -m json.tool || true
          echo ""
          echo "=== PAGE INFO ==="
          curl -s "https://graph.facebook.com/v21.0/${FB_PAGE_ID}?fields=id,name,username&access_token=${FB_PAGE_ACCESS_TOKEN}" | python3 -m json.tool || true

      - name: Get all page tokens
        id: get-tokens
        if: github.event.inputs.action == 'get_all_page_tokens'
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          curl -s "https://graph.facebook.com/v21.0/me/accounts?fields=id,name,username,access_token&limit=100&access_token=${FB_PAGE_ACCESS_TOKEN}" > /tmp/pages.json
          python3 << 'PYEOF'
          import json
          with open("/tmp/pages.json") as f:
              data = json.load(f)
          for page in data.get("data", []):
              pid = page["id"]
              name = page.get("name","")
              user = page.get("username","")
              token = page.get("access_token","")
              key = pid
              if "fengshui" in (name+user).lower() or pid == "367355370015900":
                  key = "fengshui"
              elif "aviva" in (name+user).lower() or pid == "445083192208430":
                  key = "aviva"
              elif "flow" in (name+user).lower() or pid == "914737241717875":
                  key = "flow"
              elif "miracles" in (name+user).lower() or pid == "107760637798012":
                  key = "miracles"
              print(f"::set-output name={key}_token::{token}")
              # Also write a non-masked version for verification
              print(f"  {name} (@{user}) → {key} → {token[:10]}...{token[-6:]}")
          PYEOF

      - name: Try test post
        if: github.event.inputs.action == 'test_post'
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ github.event.inputs.target_page || '367355370015900' }}
        run: |
          echo "=== POSTING TO ${FB_PAGE_ID} ==="
          RESULT=$(curl -s -X POST "https://graph.facebook.com/v21.0/${FB_PAGE_ID}/feed" \
            -d "message=🧪 Social Content Factory test — deleting shortly" \
            -d "access_token=${FB_PAGE_ACCESS_TOKEN}")
          echo "$RESULT" | python3 -m json.tool || true
          POST_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -n "$POST_ID" ]; then
            echo "✅ Created: ${POST_ID} — deleting..."
            sleep 3
            curl -s -X DELETE "https://graph.facebook.com/v21.0/${POST_ID}?access_token=${FB_PAGE_ACCESS_TOKEN}" | python3 -m json.tool || true
          else
            echo "❌ Failed"
          fi
