name: Meta API — check permissions & test post

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options:
          - debug_only
          - test_post
      target_page:
        description: 'FB Page ID (Fengshui=367355370015900, Aviva=445083192208430)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  meta-api:
    runs-on: ubuntu-latest
    steps:
      - name: Debug token + check permissions
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          FB_PAGE_ID: ${{ github.event.inputs.target_page }}
        run: |
          echo "=== TOKEN DEBUG ==="
          curl -s "https://graph.facebook.com/v21.0/debug_token?input_token=${FB_PAGE_ACCESS_TOKEN}&access_token=${FB_APP_ID}|${FB_APP_SECRET}" | python3 -m json.tool

          echo ""
          echo "=== PAGE INFO ==="
          curl -s "https://graph.facebook.com/v21.0/${FB_PAGE_ID}?fields=id,name,username,access_token&access_token=${FB_PAGE_ACCESS_TOKEN}" | python3 -m json.tool

          echo ""
          echo "=== IG BUSINESS ACCOUNT ==="
          curl -s "https://graph.facebook.com/v21.0/${FB_PAGE_ID}?fields=instagram_business_account&access_token=${FB_PAGE_ACCESS_TOKEN}" | python3 -m json.tool

      - name: Try test post (unpublished draft)
        if: github.event.inputs.action == 'test_post'
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ github.event.inputs.target_page }}
        run: |
          echo "=== ATTEMPTING DRAFT POST ==="
          RESULT=$(curl -s -X POST "https://graph.facebook.com/v21.0/${FB_PAGE_ID}/feed" \
            -d "message=🧪 Test post from Social Content Factory — please ignore" \
            -d "published=false" \
            -d "access_token=${FB_PAGE_ACCESS_TOKEN}")
          echo "$RESULT" | python3 -m json.tool

          # If post was created, delete the draft immediately
          POST_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -n "$POST_ID" ]; then
            echo ""
            echo "✅ Draft created: ${POST_ID} — deleting now..."
            curl -s -X DELETE "https://graph.facebook.com/v21.0/${POST_ID}?access_token=${FB_PAGE_ACCESS_TOKEN}" | python3 -m json.tool
          else
            echo ""
            echo "❌ Post failed — check error above"
          fi
