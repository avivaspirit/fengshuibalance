name: Check Miracles369 Admin
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check page roles
        env:
          MIRACLES_TOKEN: ${{ secrets.MIRACLES_PAGE_ACCESS_TOKEN }}
          PAGE_ID: "107760637798012"
        run: |
          set +e
          echo "=== Approach 1: /page/roles ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo "=== Approach 2: /page?fields=roles ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=roles&access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo "=== Approach 3: Business Manager ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=owner_business&access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo "=== Approach 4: page_user_tasks ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/user_permissions?access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo "=== Approach 5: Business system users ==="
          BIZ_ID=$(curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=owner_business&access_token=${MIRACLES_TOKEN}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('owner_business',{}).get('id','') if isinstance(d.get('owner_business'), dict) else d.get('owner_business',''))" 2>/dev/null)
          echo "Business ID: ${BIZ_ID}"
          if [ -n "${BIZ_ID}" ]; then
            echo "--- Business users on page ---"
            curl -s "https://graph.facebook.com/v21.0/${BIZ_ID}/business_users?access_token=${MIRACLES_TOKEN}"
            echo ""
            echo "--- System users ---"
            curl -s "https://graph.facebook.com/v21.0/${BIZ_ID}/system_users?access_token=${MIRACLES_TOKEN}"
            echo ""
            echo "--- Page permissions ---"
            curl -s "https://graph.facebook.com/v21.0/${BIZ_ID}/owned_pages?access_token=${MIRACLES_TOKEN}"
            echo ""
          fi
          
          echo "=== Approach 6: /me/accounts with tasks ==="
          curl -s "https://graph.facebook.com/v21.0/me/accounts?fields=id,name,tasks&access_token=${MIRACLES_TOKEN}"
          echo ""
