name: Check Miracles369 Admin
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check page roles via multiple approaches
        env:
          MIRACLES_TOKEN: ${{ secrets.MIRACLES_PAGE_ACCESS_TOKEN }}
          PAGE_ID: "107760637798012"
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          PAGE_TOKEN=$(curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=access_token&access_token=${MIRACLES_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          
          echo "=== Approach 1: /page/roles (page token) ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${PAGE_TOKEN}" | python3 -m json.tool
          
          echo ""
          echo "=== Approach 2: /page (roles field) ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=roles{name,id,role}&access_token=${PAGE_TOKEN}" | python3 -m json.tool
          
          echo ""
          echo "=== Approach 3: /page/admins ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/admins?access_token=${PAGE_TOKEN}" | python3 -m json.tool
          
          echo ""
          echo "=== Approach 4: List all businesses for this page ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=connected_page_backed_instagram_account,owner_business&access_token=${PAGE_TOKEN}" | python3 -m json.tool
          
          echo ""
          echo "=== Approach 5: Business users ==="
          BIZ=$(curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=owner_business&access_token=${PAGE_TOKEN}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('owner_business',{}).get('id',''))" 2>/dev/null)
          echo "Business ID: $BIZ"
          if [ -n "$BIZ" ]; then
            echo "--- Business system users ---"
            curl -s "https://graph.facebook.com/v21.0/${BIZ}/system_users?fields=id,name,role,assigned_permissions&access_token=${PAGE_TOKEN}" | python3 -m json.tool
            echo "--- Business user roles on page ---"
            curl -s "https://graph.facebook.com/v21.0/${BIZ}/owned_pages?fields=id,name,role&access_token=${PAGE_TOKEN}" | python3 -m json.tool
          fi
          
          echo ""
          echo "=== Approach 6: /me/accounts (check page access) ==="
          curl -s "https://graph.facebook.com/v21.0/me/accounts?fields=id,name,task&access_token=${PAGE_TOKEN}" | python3 -m json.tool
          
          echo ""
          echo "=== Approach 7: Page access token tasks ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=access_token&access_token=${PAGE_TOKEN}" | python3 -m json.tool
          
          echo ""
          echo "=== Token debug ==="
          curl -s "https://graph.facebook.com/debug_token?input_token=${PAGE_TOKEN}&access_token=${PAGE_TOKEN}" | python3 -m json.tool
