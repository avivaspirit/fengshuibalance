name: Find Mac User ID
on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Find Mac user ID from all page tokens
        env:
          MIRACLES_TOKEN: ${{ secrets.MIRACLES_PAGE_ACCESS_TOKEN }}
          FENGSHUI_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FLOW_TOKEN: ${{ secrets.FLOW_PAGE_ACCESS_TOKEN }}
          AVIVA_TOKEN: ${{ secrets.AVIVA_PAGE_CCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          APP_TOKEN=$(curl -s "https://graph.facebook.com/oauth/access_token?client_id=${FB_APP_ID}&client_secret=${FB_APP_SECRET}&grant_type=client_credentials" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token','FAIL'))")
          echo "=== debug ALL page tokens to find user_id ==="
          
          for TOKEN_VAR in MIRACLES_TOKEN FENGSHUI_TOKEN FLOW_TOKEN AVIVA_TOKEN; do
            TOK=$(eval echo \${$TOKEN_VAR})
            echo ""
            echo "--- ${TOKEN_VAR} ---"
            RESULT=$(curl -s "https://graph.facebook.com/v21.0/debug_token?input_token=${TOK}&access_token=${APP_TOKEN}")
            echo "$RESULT" | python3 -c "
import sys, json
d = json.load(sys.stdin)['data']
print(f"  type={d.get('type')}  profile_id={d.get('profile_id')}  user_id={d.get('user_id','N/A')}")
"
          done
          
          echo ""
          echo "=== Try /page_id/page_admins ==="
          curl -s "https://graph.facebook.com/v21.0/107760637798012/page_admins?access_token=${MIRACLES_TOKEN}"
          echo ""
