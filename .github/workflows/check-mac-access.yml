name: Remove Mac from Miracles369
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Mac's Facebook User ID"
        required: true
        type: string

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove Mac role from Miracles369
        env:
          MIRACLES_TOKEN: ${{ secrets.MIRACLES_PAGE_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          PAGE_ID="107760637798012"
          USER_ID="${{ github.event.inputs.user_id }}"
          
          echo "=== Pre-check: current /roles ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo ""
          echo "=== Attempt DELETE /{page}/roles/{user} ==="
          curl -s -X DELETE "https://graph.facebook.com/v21.0/${PAGE_ID}/roles/${USER_ID}?access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo ""
          echo "=== Post-check: /roles after delete ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${MIRACLES_TOKEN}"
          echo ""
