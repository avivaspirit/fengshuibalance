name: Deep check Mac on Miracles369
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Deep role check
        env:
          MIRACLES_TOKEN: ${{ secrets.MIRACLES_PAGE_ACCESS_TOKEN }}
          FENGSHUI_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          PAGE_ID="107760637798012"
          MT=$(curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=access_token&access_token=${MIRACLES_TOKEN}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token','FAIL'))")
          
          echo "=== /assigned_users (admin list) ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/assigned_users?access_token=${MT}"
          echo ""
          
          echo "=== /subscribed_apps ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/subscribed_apps?access_token=${MT}"
          echo ""
          
          echo "=== Try to GET /roles with fields ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?fields=name,email,role,tasks,status&access_token=${MT}"
          echo ""
          
          echo "=== Try user token via exchange ==="
          # Can we use the MIRACLES_TOKEN as a user token?
          echo "--- /me with MIRACLES_TOKEN ---"
          curl -s "https://graph.facebook.com/v21.0/me?fields=id,name&access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo "--- /me/accounts with MIRACLES_TOKEN ---"
          curl -s "https://graph.facebook.com/v21.0/me/accounts?fields=id,name,access_token&access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo "--- Test: can this token post to Miracles369? (dry check only) ---"
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=can_post,can_manage&access_token=${MT}"
          echo ""
          
          echo "=== Fengshuibalance /roles with fields ==="
          FB_PID="${{ secrets.FB_PAGE_ID }}"
          FT=$(curl -s "https://graph.facebook.com/v21.0/${FB_PID}?fields=access_token&access_token=${FENGSHUI_TOKEN}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token','FAIL'))")
          curl -s "https://graph.facebook.com/v21.0/${FB_PID}/roles?fields=name,email,role,tasks&access_token=${FT}"
          echo ""
