name: Facebook article sync

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Scan full FB history for missing posts"
        type: boolean
        default: false
  repository_dispatch:
    types: [facebook-sync]

permissions:
  contents: write

concurrency:
  group: fengshui-fb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Verify Facebook token
        continue-on-error: true
        id: token-check
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: python scripts/sync-facebook-posts.py --verify-token

      - name: Check token result
        if: steps.token-check.outcome == 'failure'
        run: |
          echo "⚠️ Token verification failed — attempting sync anyway (token may still work for reads)."
          echo "If sync also fails, the FB_PAGE_ACCESS_TOKEN secret needs rotation."

      - name: Sync original Facebook posts
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python scripts/sync-facebook-posts.py --backfill
          else
            python scripts/sync-facebook-posts.py
          fi

      - name: Regenerate sitemap.xml and robots.txt
        run: python scripts/generate-sitemap.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Defensive: strip any regenerated __pycache__ from the index + worktree
          git rm -r --cached --ignore-unmatch 'scripts/__pycache__/' >/dev/null 2>&1 || true
          git clean -fdX scripts/ >/dev/null 2>&1 || true
          git add articles-full.js articles/ scripts/fb-sync-state.json scripts/fb-sync-report.json sitemap.xml sitemap-main.xml sitemap-articles.xml robots.txt page-stats.json
          if git diff --staged --quiet; then
            echo "No sync changes"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "Sync Facebook page content and follower stats from Fengshui Balance"
          # Retry push with rebase — handles race condition when two sync runs overlap
          for ATTEMPT in 1 2 3; do
            if git push origin main 2>/dev/null; then
              echo "Push succeeded on attempt $ATTEMPT"
              echo "changed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Push attempt $ATTEMPT failed — rebasing and retrying..."
            git pull --rebase origin main 2>/dev/null || true
            sleep 5
          done
          echo "❌ All push attempts failed"
          exit 1

      - name: Deploy to Vercel
        if: success()
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set; skipping deploy."
            exit 0
          fi
          npm install -g vercel@54
          VERCEL_TOKEN="$VERCEL_TOKEN" vercel deploy --prod --yes
