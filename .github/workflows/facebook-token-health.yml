name: Facebook token health

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify token still valid
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          python scripts/sync-facebook-posts.py --verify-token > token-report.json
          python - <<'PY'
          import json, sys
          report = json.load(open("token-report.json", encoding="utf-8"))
          expiry = report.get("expiry") or {}
          if expiry.get("never_expires"):
              print("Permanent token OK")
              sys.exit(0)
          days = expiry.get("days_left")
          if days is not None and days < 14:
              print(f"Token expires in {days} days — replace with System User token")
              sys.exit(1)
          if report.get("warning"):
              print(report["warning"])
              sys.exit(1)
          print("Token OK")
          PY
