name: M369 Final Remove
on:
  push:
    paths:
      - .github/workflows/m369-final.yml

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Exchange + DELETE role + cleanup
        env:
          SHORT_TOKEN: "EAAOOrC2AbRQBRZCqs3gKnXQM1sRRigNNVeMOXVowgFI0X14aDGZBdpT6tqVfjlFLFOwrTFHAu2BntU8EpIGEEKsPR4KbD0UEczdSxs6uC5l7uZBZAXiNUFKVijTRC7UEagj4QSEBlBNxDYhlLGdTTEs3nWFIu7T54lAgB0tjh3NIua0vVBIvo43CtT9B32ZCcM9Tv139DNa6VLvJz5FWrK5ZBhwMLt1XXGdM6ZAW7KAYaPOv5h3FCqznrrz8R0oVZCwADnrU1q364pvgrfxrv52GmAZDZD"
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAGE_ID="107760637798012"
          USER_ID="27624467037138833"
          
          echo "=== Exchange to long-lived ==="
          LL=$(curl -s "https://graph.facebook.com/v21.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${FB_APP_ID}&client_secret=${FB_APP_SECRET}&fb_exchange_token=${SHORT_TOKEN}")
          echo "$LL" | python3 -m json.tool
          LONG_TOKEN=$(echo "$LL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          echo "Got long token: ${LONG_TOKEN:0:15}..."
          
          echo ""
          echo "=== /me/accounts (verify pages) ==="
          curl -s "https://graph.facebook.com/v21.0/me/accounts?fields=id,name&limit=100&access_token=${LONG_TOKEN}"
          echo ""
          
          echo ""
          echo "=== DELETE /roles ==="
          curl -s -X DELETE "https://graph.facebook.com/v21.0/${PAGE_ID}/roles/${USER_ID}?access_token=${LONG_TOKEN}"
          echo ""
          
          echo ""
          echo "=== /roles after ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${LONG_TOKEN}"
          echo ""
          
          echo ""
          echo "=== Self-delete ==="
          SHA=$(curl -s -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/avivaspirit/fengshuibalance/contents/.github/workflows/m369-final.yml" | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          curl -s -X DELETE -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/avivaspirit/fengshuibalance/contents/.github/workflows/m369-final.yml" -d "{\"message\":\"cleanup\",\"sha\":\"${SHA}\",\"branch\":\"main\"}"
