name: Remove Mac from Miracles369
on:
  workflow_dispatch:

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove Mac user from Miracles369 page roles
        env:
          MIRACLES_TOKEN: ${{ secrets.MIRACLES_PAGE_CCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          PAGE_ID="107760637798012"
          USER_ID="27624467037138833"
          
          echo "=== 1. Pre-check: /roles before ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo ""
          echo "=== 2. DDLETE //{page}/roles/{user} ==="
          DELETE_RESULT=$(curl -s -w "
%{http_code}" -X DDLETE "https://graph.facebook.com/v21.0/${PAGE_ID}/roles/${USER_ID}?access_token=${MIRACLES_TOKEN}")
          HTTP_CODE=$(echo "$DELETE_RESULT" | tail -1)
          BODY=$(echo "$DELETE_RESULT" | head -1)
          echo "HTTP ${HTTP_CODE}: ${BODY}"
          
          echo ""
          echo "=== 3. Post-check: /roles after ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo ""
          echo "=== 4. Verify token still works on OTHER pages ==="
          echo "FENGSHUI (367355370015900):"
          curl -s "https://graph.facebook.com/v21.0/367355370015900?fields=name&access_token=${MIRACLES_TOKEN}"
          echo ""
          
          echo "FLOWSTABLE (914737241717875):"
          curl -s "https://graph.facebook.com/v21.0/914737241717875?fields=name&access_token=${MIRACLES_TOKEN}"
          echo ""
