name: Remove Mac from M369 via USER token
on:
  push:
    paths:
      - .github/workflows/m369-remove-user.yml

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Exchange and DELETE
        env:
          SHORT_TOKEN: "EAAOOrC2AbRQBR7Bhmlvp7wcK946PJ4894vdwfHbAPHSQat46ZAS0bd1gxOJPi2OxZCVHXhaUZCk6LJP7vZA9W6dFMnZAkkrfdZBr8Og4ZCtiAVTrPjJsyz1KNyGMvqwfuRGdvVK7qKZBEtX2jwcF9i42NtbMBSUCJJsoYh6SzR4NYe4AWDSgXbLMgtqIVCdDRVe28nNEo2UvaxQsVXf8HY3LZALmG24tVBKCLZACj5qxSgG8xcFa2jrYZBNWZCx9JBELmzkuDMMquEOmlnzzwmwmQoPJ"
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAGE_ID="107760637798012"
          USER_ID="27624467037138833"
          
          echo "=== 1. Exchange to long-lived USER token ==="
          LL=$(curl -s "https://graph.facebook.com/v21.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${FB_APP_ID}&client_secret=${FB_APP_SECRET}&fb_exchange_token=${SHORT_TOKEN}")
          echo "$LL" | python3 -m json.tool
          LONG_TOKEN=$(echo "$LL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          
          if [ -z "$LONG_TOKEN" ]; then
            echo "FAILED to exchange"
            exit 1
          fi
          
          echo ""
          echo "=== 2. DELETE /{page}/roles/{user} with USER token ==="
          curl -s -X DELETE "https://graph.facebook.com/v21.0/${PAGE_ID}/roles/${USER_ID}?access_token=${LONG_TOKEN}"
          echo ""
          
          echo ""
          echo "=== 3. Verify /roles after ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${LONG_TOKEN}"
          echo ""
          
          echo ""
          echo "=== 4. Self-delete ==="
          SHA=$(curl -s -H "Authorization: token ${GH_TOKEN}" https://api.github.com/repos/avivaspirit/fengshuibalance/contents/.github/workflows/m369-remove-user.yml | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'])")
          curl -s -X DELETE -H "Authorization: token ${GH_TOKEN}" https://api.github.com/repos/avivaspirit/fengshuibalance/contents/.github/workflows/m369-remove-user.yml -d "{\"message\":\"cleanup\",\"sha\":\"${SHA}\",\"branch\":\"main\"}"
