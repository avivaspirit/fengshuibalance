name: Remove Admin Miracles369 v2
on:
  workflow_dispatch:

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove Mac from Miracles369
        env:
          MIRACLES_TOKEN: ${{ secrets.MIRACLES_PAGE_ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          PAGE_ID: "107760637798012"
          USER_ID: "27624467037138833"
        run: |
          set -e
          
          # Get fresh page token
          PAGE_TOKEN=$(curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=access_token&access_token=${MIRACLES_TOKEN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token','FAILED'))")
          echo "Page token: ${PAGE_TOKEN:0:30}..."
          
          echo ""
          echo "=== A: /page/roles ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${PAGE_TOKEN}"
          
          echo ""
          echo "=== B: DELETE /page/roles/{user_id} ==="
          curl -s -X DELETE "https://graph.facebook.com/v21.0/${PAGE_ID}/roles/${USER_ID}?access_token=${PAGE_TOKEN}"
          
          echo ""
          echo "=== C: DELETE /page/admins/{user_id} ==="
          curl -s -X DELETE "https://graph.facebook.com/v21.0/${PAGE_ID}/admins/${USER_ID}?access_token=${PAGE_TOKEN}"
          
          echo ""
          echo "=== D: /page?fields=roles ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=roles&access_token=${PAGE_TOKEN}"
          
          echo ""
          echo "=== E: Try with long-lived user token approach ==="
          # Get app access token
          APP_TOKEN=$(curl -s "https://graph.facebook.com/oauth/access_token?client_id=${FB_APP_ID}&client_secret=${FB_APP_SECRET}&grant_type=client_credentials" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token','FAILED'))")
          
          # Use app token to check roles
          echo "--- Roles via app token ---"
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}/roles?access_token=${APP_TOKEN}"
          
          echo ""
          echo "--- DELETE via app token ---"
          curl -s -X DELETE "https://graph.facebook.com/v21.0/${PAGE_ID}/roles/${USER_ID}?access_token=${APP_TOKEN}"
          
          echo ""
          echo "=== F: Page scoped permissions ==="
          curl -s "https://graph.facebook.com/v21.0/${PAGE_ID}?fields=perms&access_token=${PAGE_TOKEN}"
          
          echo ""
          echo "=== G: Check who has page tasks ==="
          curl -s "https://graph.facebook.com/v21.0/me/accounts?fields=id,name,tasks,access_token&access_token=${MIRACLES_TOKEN}" | python3 -c "
import sys, json
data = json.load(sys.stdin)
for page in data.get('data', []):
    if page.get('id') == '${PAGE_ID}':
        print(f'Page: {page.get("name")}')
        print(f'Tasks: {page.get("tasks", [])}')
        print(f'Has access_token: {bool(page.get("access_token"))}')
"
